[package]
name = "carrick-conformance-nt"
version = "0.1.0"
edition = "2021"
description = "Differential black-box oracle harness and receipt verification for Carrick NT"

[dependencies]
base64 = "0.22"
carrick-pe-loader = { path = "../carrick-pe-loader" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[[bin]]
name = "carrick-oracle-capture"
path = "src/bin/oracle_capture.rs"

[[bin]]
name = "carrick-import-census"
path = "src/bin/import_census.rs"

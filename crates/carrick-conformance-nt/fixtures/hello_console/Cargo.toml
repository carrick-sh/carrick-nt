[package]
name = "hello_console"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

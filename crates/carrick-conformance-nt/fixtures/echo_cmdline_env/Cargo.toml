[package]
name = "echo_cmdline_env"
version = "0.1.0"
edition = "2021"
description = "Clean-room x86_64 Windows console fixture echoing CommandLine and environment variable"

[workspace]

[dependencies.windows-sys]
version = "0.59.0"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_System_IO",
]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"


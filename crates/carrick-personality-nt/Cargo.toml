[package]
name = "carrick-personality-nt"
version = "0.1.0"
edition = "2021"
description = "Clean-room Windows NT personality call decoder and dispatch for Carrick"
authors = ["Timothy J Fontaine <tjfontaine@atxconsulting.com>"]
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []
test-support = []

[dependencies]
carrick-core = { git = "https://github.com/carrick-sh/carrick.git", rev = "64931dbf3b6e54dd362df2feada02781918149c8" }
carrick-guest-arch = { git = "https://github.com/carrick-sh/carrick.git", rev = "64931dbf3b6e54dd362df2feada02781918149c8" }
carrick-nt-abi = { path = "../carrick-nt-abi" }

[dev-dependencies]
carrick-personality-nt = { path = ".", features = ["test-support"] }
serde_json = "1.0"
